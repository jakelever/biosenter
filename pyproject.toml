[project]
name = "biosenter"
version = "0.1.0"
description = "Biomedical sentence splitting for PubMed/PMC text, built on spaCy and bioconverters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "spacy>=3.8",
    "bioconverters>=3.0",
]

[project.optional-dependencies]
train = [
    "requests>=2.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["biosenter*"]

[tool.setuptools.package-data]
biosenter = ["senter/config.cfg", "model/**/*"]
